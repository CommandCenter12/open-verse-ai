name = "open-verse-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated origins (scheme + host only, no path). Browsers send the host lowercased.
ALLOWED_ORIGINS = "https://commandcenter12.github.io,http://localhost:8080,http://127.0.0.1:8080"
REPO_URL = "https://github.com/CommandCenter12/open-verse-ai"
RATE_PER_MINUTE = "20"
QUOTA_PER_DAY = "500"
KEYS_PER_IP_DAY = "20"
# General (non-docs) answers via Workers AI. Set GENERAL_ENABLED = "false" to turn off.
GENERAL_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GENERAL_PER_DAY = "50"           # per key, per UTC day
GENERAL_GLOBAL_PER_DAY = "2000"  # all keys combined: caps your Workers AI bill
# Passkey (Touch ID) sign-in. Origins of pages allowed to use it; each origin's
# hostname is the WebAuthn RP ID. Passkeys made on one origin only work there.
PASSKEY_ORIGINS = "https://commandcenter12.github.io,http://localhost:8080"
PASSKEY_ATTEMPTS_PER_HOUR = "30"  # per network
SESSION_HOURS = "12"
# Owner memory learns from conversations and "remember that …". "false" turns it off.
MEMORY_LEARN = "true"

# Cloudflare Workers AI. In `wrangler dev` this binding always calls the real
# service and uses your account's Workers AI allowance.
[ai]
binding = "AI"
remote = true  # local dev calls the real Workers AI (there is no local model)

[[d1_databases]]
binding = "DB"
database_name = "open-verse-ai"
database_id = "2c68ba2c-166b-4a86-a6ed-7d40696df73c"
migrations_dir = "migrations"

# Hourly cleanup of expired rate-limit counters.
[triggers]
crons = ["17 * * * *"]
