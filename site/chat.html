<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Verse Ai Chat</title>
<meta name="description" content="Chat with Open Verse Ai: saved chats, folders, pins, model choice and memory.">
<script>document.documentElement.classList.add('ova-locked')</script>
<link rel="stylesheet" href="assets/chat.css">
<link rel="stylesheet" href="assets/lock.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script src="assets/config.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="side-top">
      <a class="brand" href="index.html"><span class="mark">OV</span><span>Open Verse Ai</span></a>
      <button class="icon-btn" id="collapse" title="Hide sidebar" aria-label="Hide sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button class="new-chat" id="new-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <nav class="side-scroll" id="side-list" aria-live="polite"></nav>
    <div class="side-foot">
      <a href="portal.html">API keys</a> · <a href="docs.html">Docs</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <header class="nav topbar"><div class="wrap">
      <button class="icon-btn" id="open-side" title="Show sidebar" aria-label="Show sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="chat-title" id="chat-title"></div>
    </div></header>

    <section class="thread" id="thread" aria-live="polite"></section>

    <section class="hello" id="hello">
      <h1>What's up, Mohammad?</h1>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask anything… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
        <div class="row">
          <select id="model" aria-label="Model">
            <option value="auto">Auto (best available)</option>
            <option value="plus">Open Source+ (Qwen + Llama + Gemma)</option>
            <option value="qwen">Qwen 3.8 27B</option>
            <option value="gemma">Gemma 4 26B</option>
            <option value="llama4">Llama 4 Scout</option>
            <option value="llama">Llama 3.3 70B</option>
            <option value="mistral">Mistral Small 3.1</option>
          </select>
          <label class="toggle" title="Use your past chats, facts and Google data as memory">
            <input type="checkbox" id="use-memory" checked> <span>Use past chats as memory</span>
          </label>
          <button type="submit" class="send" id="send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="fine">AI answers can be wrong. Numbers are computed exactly; check the setup.</div>
    </form>
  </main>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="modal" id="modal" hidden><div class="modal-card"><label id="modal-label" for="modal-input"></label><input id="modal-input" maxlength="80"><div class="modal-actions"><button type="button" class="ghost" id="modal-cancel">Cancel</button><button type="button" id="modal-ok">Save</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<script src="assets/chat.js"></script>
<script src="assets/lock.js"></script>
</body>
</html>
